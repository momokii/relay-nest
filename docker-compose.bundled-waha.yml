services:
  api:
    environment:
      WAHA_BASE_URL: http://waha:3000
    depends_on:
      waha:
        condition: service_healthy
  waha:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
