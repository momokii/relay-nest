    - text: Schedules are one-time only; recurrence is not available.
    - strong: Safety checkpoint
    - text: Transport acceptance is not proof of recipient delivery. Pacing, quiet hours, consent, and WAHA state are checked server-side.
    - button "Create one-time schedule"
    - text: Each submission receives a fresh idempotency key.
