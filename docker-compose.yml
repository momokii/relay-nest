name: waha-command-center

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: waha_command_center
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d waha_command_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "3000"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: waha_command_center
      DATABASE_USER: app
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      ENCRYPTION_MASTER_KEY_FILE: /run/secrets/encryption_master_key
      WAHA_BASE_URL: ${WAHA_BASE_URL:-https://waha.example.invalid}
      WAHA_WEBHOOK_BASE_URL: ${WAHA_WEBHOOK_BASE_URL:-http://api:3000}
      WAHA_WEBHOOK_SECRET_FILE: /run/secrets/waha_webhook_secret
    secrets:
      - postgres_password
      - encryption_master_key
      - waha_webhook_secret
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  waha:
    build:
      context: .
      dockerfile: Dockerfile.waha
    image: relaynest-waha:latest-2026.8.1
    profiles: ["waha"]
    restart: unless-stopped
    volumes:
      - waha-sessions:/app/.sessions
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  waha-sessions:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./.secrets/postgres_password}
  encryption_master_key:
    file: ${ENCRYPTION_MASTER_KEY_FILE:?Set ENCRYPTION_MASTER_KEY_FILE to a secret file}
  waha_webhook_secret:
    file: ${WAHA_WEBHOOK_SECRET_FILE:-./.secrets/waha_webhook_secret}
